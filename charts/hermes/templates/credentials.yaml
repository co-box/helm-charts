{{- if .Values.credentials.generate }}
# Credentials the instance generates for itself — never in git, never typed by hand.
#
#   API_SERVER_KEY                        bearer token of the OpenAI-compatible API (port 8642)
#   HERMES_DASHBOARD_BASIC_AUTH_PASSWORD  dashboard login password
#
# Both come from ESO `Password` generators, and the ExternalSecret uses ONLY generators — no
# SecretStore, so nothing else in this cluster has to be granted read access on their behalf.
#
# `refreshPolicy: OnChange` matters: a periodic refresh would re-run the generators and rotate
# the dashboard password out from under whoever is logged in. The values are rendered once,
# when this object is created or edited. Rotate deliberately with:
#   kubectl -n <namespace> annotate externalsecret <existingSecret> rotate="$(date +%s)" --overwrite
#   kubectl -n <namespace> rollout restart deploy/<fullname>
#
# Credentials that cannot be generated (a model provider key belongs to the upstream account)
# belong in existingSecret or extraEnvFrom, installed out of band.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "hermes.fullname" . }}-api-server-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.credentials.syncWave | quote }}
spec:
  length: {{ .Values.credentials.apiServerKey.length }}
  encoding: hex
  digits: 0
  symbols: 0
  noUpper: true
  allowRepeat: true
  secretKeys:
    - API_SERVER_KEY
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "hermes.fullname" . }}-dashboard-password
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.credentials.syncWave | quote }}
spec:
  length: {{ .Values.credentials.dashboardPassword.length }}
  encoding: raw
  digits: 4
  symbols: 0
  allowRepeat: true
  secretKeys:
    - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ required "existingSecret is required when credentials.generate is true" .Values.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.credentials.syncWave | quote }}
spec:
  refreshPolicy: OnChange
  target:
    name: {{ required "existingSecret is required when credentials.generate is true" .Values.existingSecret }}
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "hermes.fullname" . }}-api-server-key
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "hermes.fullname" . }}-dashboard-password
{{- end }}
