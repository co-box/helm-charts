{{- if .Values.config }}
# The instance's starting config.yaml. The `seed-config` init container copies it into the
# volume ONLY when no config.yaml exists yet, so `hermes config set` (or a dashboard change)
# always wins over this file. To adopt an edit here, remove the volume's config.yaml and
# restart the pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hermes.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- .Values.config | nindent 4 }}
{{- end }}
