{{- if .Values.persistence.enabled }}
# $HERMES_HOME: config.yaml, state.db (sessions + FTS5), skills, memories, cron jobs, workspace.
#
# A standalone PVC rather than a StatefulSet volumeClaimTemplate: a template cannot be resized
# in place, which would leave GitOps controllers reporting OutOfSync on any size change.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hermes.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
  {{- with .Values.persistence.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
