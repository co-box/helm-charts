{{- if .Values.serviceAccount.create }}
# No API access is granted to the agent itself; the account exists so the pod identity is
# explicit and can carry workload identity annotations.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hermes.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
