{{- range $secret := .Values.secrets }}
{{- $secretName := required "eso-pw-generator: every entry in .Values.secrets needs a name" $secret.name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "eso-pw-generator.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    {{- with $secret.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $.Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  refreshPolicy: {{ $secret.refreshPolicy | default $.Values.refreshPolicy }}
  target:
    name: {{ $secretName }}
    creationPolicy: {{ $secret.creationPolicy | default $.Values.creationPolicy }}
    immutable: {{ if hasKey $secret "immutable" }}{{ $secret.immutable }}{{ else }}{{ $.Values.immutable }}{{ end }}
  dataFrom:
    {{- range $key := $secret.keys }}
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: {{ include "eso-pw-generator.generatorName" (dict "root" $ "secret" $secret "key" $key) }}
    {{- end }}
{{- end }}
