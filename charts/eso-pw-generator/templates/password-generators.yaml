{{- range $secret := .Values.secrets }}
{{- $secretName := required "eso-pw-generator: every entry in .Values.secrets needs a name" $secret.name }}
{{- if not $secret.keys }}
{{- fail (printf "eso-pw-generator: secret %q has no keys" $secretName) }}
{{- end }}
{{- $seenKeys := dict }}
{{- range $key := $secret.keys }}
{{- $keyName := required (printf "eso-pw-generator: every key of secret %q needs a name" $secretName) $key.name }}
{{- if hasKey $seenKeys $keyName }}
{{- fail (printf "eso-pw-generator: secret %q declares key %q more than once" $secretName $keyName) }}
{{- end }}
{{- $_ := set $seenKeys $keyName true }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: {{ include "eso-pw-generator.generatorName" (dict "root" $ "secret" $secret "key" $key) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "eso-pw-generator.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    {{- with $secret.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with $.Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  length: {{ $key.length | default $.Values.defaults.length }}
  encoding: {{ $key.encoding | default $.Values.defaults.encoding }}
  digits: {{ if hasKey $key "digits" }}{{ $key.digits }}{{ else }}{{ $.Values.defaults.digits }}{{ end }}
  symbols: {{ if hasKey $key "symbols" }}{{ $key.symbols }}{{ else }}{{ $.Values.defaults.symbols }}{{ end }}
  noUpper: {{ if hasKey $key "noUpper" }}{{ $key.noUpper }}{{ else }}{{ $.Values.defaults.noUpper }}{{ end }}
  allowRepeat: {{ if hasKey $key "allowRepeat" }}{{ $key.allowRepeat }}{{ else }}{{ $.Values.defaults.allowRepeat }}{{ end }}
  {{- if hasKey $key "symbolCharacters" }}
  symbolCharacters: {{ $key.symbolCharacters | quote }}
  {{- end }}
  {{- if hasKey $key "prefix" }}
  prefix: {{ $key.prefix | quote }}
  {{- end }}
  {{- if hasKey $key "suffix" }}
  suffix: {{ $key.suffix | quote }}
  {{- end }}
  # One generator per key, so the output key is already the name the consumers expect.
  secretKeys:
    - {{ $keyName | quote }}
{{- end }}
{{- end }}
